<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>DeepSeek 角色扮演 · 手机版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: #0f172a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        /* 顶部简洁栏 */
        .top-bar {
            background: #1e293b;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .logo {
            color: white;
            font-size: 18px;
            font-weight: 600;
        }
        .menu-btn {
            background: #334155;
            border: none;
            color: white;
            font-size: 20px;
            width: 40px;
            height: 40px;
            border-radius: 20px;
            cursor: pointer;
        }
        /* 可折叠设置面板（默认隐藏） */
        .settings-panel {
            background: #1e293b;
            padding: 0 16px;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
            flex-shrink: 0;
        }
        .settings-panel.open {
            max-height: 300px;
            padding: 12px 16px;
        }
        .api-row {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        #apiKeyInput {
            flex: 1;
            padding: 10px 14px;
            border-radius: 30px;
            border: none;
            background: #334155;
            color: white;
            font-size: 14px;
            outline: none;
        }
        #apiKeyInput::placeholder { color: #94a3b8; }
        .btn-small {
            background: #3b82f6;
            border: none;
            color: white;
            padding: 0 18px;
            border-radius: 30px;
            font-weight: 500;
            cursor: pointer;
        }
        .model-row {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .model-select {
            background: #334155;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 30px;
            font-size: 13px;
            flex: 1;
        }
        .temp-control {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #334155;
            padding: 5px 12px;
            border-radius: 30px;
        }
        .temp-control span { color: white; font-size: 13px; }
        #tempSlider { width: 100px; }
        .temp-value { color: white; font-size: 13px; min-width: 35px; }
        .expert-buttons {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }
        .expert-btn {
            background: #334155;
            border: none;
            color: white;
            padding: 8px 0;
            border-radius: 30px;
            font-size: 13px;
            flex: 1;
            cursor: pointer;
        }
        .expert-btn.active { background: #3b82f6; }
        .expert-btn.reset { background: #475569; }
        /* 聊天区域 */
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background: #0f172a;
        }
        .message {
            display: flex;
            flex-direction: column;
            max-width: 85%;
        }
        .user-message { align-self: flex-end; }
        .assistant-message { align-self: flex-start; }
        .bubble {
            padding: 12px 16px;
            border-radius: 20px;
            line-height: 1.45;
            font-size: 15px;
            word-wrap: break-word;
        }
        .user-message .bubble {
            background: #3b82f6;
            color: white;
            border-bottom-right-radius: 4px;
        }
        .assistant-message .bubble {
            background: #1e293b;
            color: #e2e8f0;
            border-bottom-left-radius: 4px;
        }
        .reasoning-block {
            margin-bottom: 8px;
            background: #1e1b10;
            border-left: 3px solid #f59e0b;
            border-radius: 12px;
            padding: 8px 12px;
            font-size: 12px;
            color: #a8a29e;
        }
        .timestamp {
            font-size: 10px;
            color: #64748b;
            margin-top: 4px;
            margin-left: 8px;
            margin-right: 8px;
        }
        /* 输入区域 */
        .input-area {
            background: #1e293b;
            padding: 12px 16px;
            display: flex;
            gap: 10px;
            align-items: flex-end;
            flex-shrink: 0;
        }
        #userInput {
            flex: 1;
            background: #334155;
            border: none;
            border-radius: 24px;
            padding: 12px 16px;
            color: white;
            font-size: 15px;
            font-family: inherit;
            resize: none;
            outline: none;
            max-height: 100px;
        }
        .icon-btn {
            background: #3b82f6;
            border: none;
            color: white;
            width: 48px;
            height: 48px;
            border-radius: 32px;
            font-size: 20px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .icon-btn.special { background: #475569; width: auto; padding: 0 16px; font-size: 14px; }
        .icon-btn.warning { background: #ef4444; }
        .icon-btn:disabled { opacity: 0.5; }
        .loading { color: #94a3b8; font-style: italic; padding: 12px; }
    </style>
</head>
<body>
<div class="top-bar">
    <span class="logo">🎭 角色扮演</span>
    <button id="menuToggle" class="menu-btn">⚙️</button>
</div>

<div id="settingsPanel" class="settings-panel">
    <div class="api-row">
        <input type="password" id="apiKeyInput" placeholder="API Key (sk-...)" autocomplete="off">
        <button id="saveKeyBtn" class="btn-small">保存</button>
    </div>
    <div class="model-row">
        <select id="modelSelect" class="model-select">
            <option value="deepseek-v4-flash">🚀 经济模式 (V4-Flash)</option>
            <option value="deepseek-v4-pro">🔥 旗舰模式 (V4-Pro)</option>
        </select>
        <div class="temp-control">
            <span>🌡️</span>
            <input type="range" id="tempSlider" min="0" max="2" step="0.05" value="1.3">
            <span id="tempValue" class="temp-value">1.30</span>
        </div>
    </div>
    <div class="expert-buttons">
        <button id="roleplayModeBtn" class="expert-btn">🎭 角色沉浸</button>
        <button id="analysisModeBtn" class="expert-btn">📐 纯分析</button>
        <button id="normalModeBtn" class="expert-btn reset">✖️ 关闭</button>
    </div>
</div>

<div class="messages-area" id="messagesArea"></div>

<div class="input-area">
    <textarea id="userInput" rows="1" placeholder="输入对话..."></textarea>
    <button id="sendBtn" class="icon-btn">➤</button>
    <button id="undoBtn" class="icon-btn warning" title="撤回">↩️</button>
    <button id="regenerateBtn" class="icon-btn special">重答</button>
</div>

<script>
    // DOM 元素
    const apiKeyInput = document.getElementById('apiKeyInput');
    const saveKeyBtn = document.getElementById('saveKeyBtn');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const messagesArea = document.getElementById('messagesArea');
    const modelSelect = document.getElementById('modelSelect');
    const tempSlider = document.getElementById('tempSlider');
    const tempValue = document.getElementById('tempValue');
    const roleplayBtn = document.getElementById('roleplayModeBtn');
    const analysisBtn = document.getElementById('analysisModeBtn');
    const normalBtn = document.getElementById('normalModeBtn');
    const undoBtn = document.getElementById('undoBtn');
    const regenerateBtn = document.getElementById('regenerateBtn');
    const menuToggle = document.getElementById('menuToggle');
    const settingsPanel = document.getElementById('settingsPanel');

    // 状态
    let currentApiKey = '';
    let conversationHistory = [];
    let currentTemperature = 1.3;
    let currentModel = 'deepseek-v4-flash';
    let expertMode = null; // 'roleplay', 'analysis', null

    const ROLEPLAY_INSTRUCTION = "〖角色沉浸要求〗你需要完全进入角色，以第一人称视角思考，用括号()或【】表示内心戏或动作细节，展现真实的情绪波动，不允许出现分析性语言。";
    const ANALYSIS_INSTRUCTION = "〖思维模式要求〗你不需要进行角色内心戏。取而代之，你需要在括号中用冷静、客观的语言进行纯分析：规划剧情走向、拆解用户意图、设计符合角色设定的回应策略。禁止使用第一人称内心独白。";

    // 存储键
    const STORAGE_KEY_HISTORY = 'deepseek_v4_rp_history_mobile';
    const STORAGE_KEY_API = 'deepseek_api_key_v4';
    const STORAGE_KEY_MODEL = 'deepseek_v4_model';
    const STORAGE_KEY_TEMP = 'deepseek_v4_temp';
    const STORAGE_KEY_EXPERT = 'deepseek_expert_mode';

    function saveHistory() { localStorage.setItem(STORAGE_KEY_HISTORY, JSON.stringify(conversationHistory)); }
    function loadHistory() {
        const saved = localStorage.getItem(STORAGE_KEY_HISTORY);
        if (saved) try { conversationHistory = JSON.parse(saved); } catch(e) { conversationHistory = []; }
        else conversationHistory = [];
    }
    function saveModelPref() { localStorage.setItem(STORAGE_KEY_MODEL, currentModel); }
    function loadModelPref() {
        const saved = localStorage.getItem(STORAGE_KEY_MODEL);
        if (saved === 'deepseek-v4-flash' || saved === 'deepseek-v4-pro') currentModel = saved;
        else currentModel = 'deepseek-v4-flash';
        modelSelect.value = currentModel;
    }
    function saveTempPref() { localStorage.setItem(STORAGE_KEY_TEMP, currentTemperature.toString()); }
    function loadTempPref() {
        const saved = localStorage.getItem(STORAGE_KEY_TEMP);
        if (saved !== null) { let tmp = parseFloat(saved); if (!isNaN(tmp) && tmp>=0 && tmp<=2) currentTemperature = tmp; }
        else currentTemperature = 1.3;
        tempSlider.value = currentTemperature;
        tempValue.innerText = currentTemperature.toFixed(2);
    }
    function saveExpertPref() { localStorage.setItem(STORAGE_KEY_EXPERT, expertMode || 'none'); }
    function loadExpertPref() {
        const saved = localStorage.getItem(STORAGE_KEY_EXPERT);
        if (saved === 'roleplay') setExpertModeUI('roleplay');
        else if (saved === 'analysis') setExpertModeUI('analysis');
        else setExpertModeUI(null);
    }
    function setExpertModeUI(mode) {
        expertMode = mode;
        roleplayBtn.classList.remove('active');
        analysisBtn.classList.remove('active');
        if (mode === 'roleplay') roleplayBtn.classList.add('active');
        else if (mode === 'analysis') analysisBtn.classList.add('active');
        saveExpertPref();
        let hint = mode === 'roleplay' ? '🎭 角色沉浸已开启' : (mode === 'analysis' ? '📐 纯分析已开启' : '专家模式已关闭');
        appendMessageToDOM('assistant', hint, new Date().toLocaleTimeString(), null, false);
    }

    function appendMessageToDOM(role, content, timestamp, reasoning = null, saveToHistory = false) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${role}-message`;
        if (role === 'assistant' && reasoning) {
            const reasoningDiv = document.createElement('div');
            reasoningDiv.className = 'reasoning-block';
            reasoningDiv.innerHTML = `<div style="font-weight:600; margin-bottom:4px;">🧠 思考过程</div><div>${escapeHtml(reasoning)}</div>`;
            messageDiv.appendChild(reasoningDiv);
        }
        const bubbleDiv = document.createElement('div');
        bubbleDiv.className = 'bubble';
        bubbleDiv.innerText = content;
        const timeSpan = document.createElement('div');
        timeSpan.className = 'timestamp';
        timeSpan.innerText = timestamp;
        messageDiv.appendChild(bubbleDiv);
        messageDiv.appendChild(timeSpan);
        messagesArea.appendChild(messageDiv);
        messagesArea.scrollTop = messagesArea.scrollHeight;
    }
    function escapeHtml(text) { return text.replace(/[&<>]/g, function(m){ if(m === '&') return '&amp;'; if(m === '<') return '&lt;'; if(m === '>') return '&gt;'; return m;}); }

    function addMessage(role, content, saveToHistory = true, timestamp = null, reasoning = null) {
        const time = timestamp || new Date().toLocaleTimeString([], { hour: '2-digit', minute:'2-digit' });
        appendMessageToDOM(role, content, time, reasoning);
        if (saveToHistory) {
            conversationHistory.push({ role, content, timestamp: time, reasoning });
            saveHistory();
        }
    }
    function renderAllMessages() {
        messagesArea.innerHTML = '';
        for (const msg of conversationHistory) {
            appendMessageToDOM(msg.role, msg.content, msg.timestamp, msg.reasoning);
        }
        messagesArea.scrollTop = messagesArea.scrollHeight;
    }
    function showTypingIndicator() {
        const div = document.createElement('div');
        div.id = 'typingIndicator';
        div.className = 'message assistant-message';
        div.innerHTML = `<div class="bubble">🤖 思考中...</div>`;
        messagesArea.appendChild(div);
        messagesArea.scrollTop = messagesArea.scrollHeight;
    }
    function removeTypingIndicator() { document.getElementById('typingIndicator')?.remove(); }
    function disableButtons(disabled) {
        sendBtn.disabled = disabled;
        saveKeyBtn.disabled = disabled;
        regenerateBtn.disabled = disabled;
        undoBtn.disabled = disabled;
    }

    async function callDeepSeekV4(rawUserMessage) {
        if (!currentApiKey) {
            addMessage('assistant', '❌ 请先保存 API Key', false);
            return;
        }
        let finalMessage = rawUserMessage;
        if (expertMode === 'roleplay') finalMessage = `${rawUserMessage}\n\n${ROLEPLAY_INSTRUCTION}`;
        else if (expertMode === 'analysis') finalMessage = `${rawUserMessage}\n\n${ANALYSIS_INSTRUCTION}`;
        addMessage('user', finalMessage, true);
        userInput.value = '';
        showTypingIndicator();
        disableButtons(true);
        const messagesForAPI = [{ role: 'system', content: '你是专业角色扮演AI。' }];
        for (const m of conversationHistory) messagesForAPI.push({ role: m.role, content: m.content });
        try {
            const resp = await fetch('https://api.deepseek.com/chat/completions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${currentApiKey}` },
                body: JSON.stringify({ model: currentModel, messages: messagesForAPI, temperature: currentTemperature, stream: false })
            });
            removeTypingIndicator();
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            const data = await resp.json();
            const reply = data.choices[0].message.content;
            const reasoning = data.choices[0].message.reasoning_content || null;
            addMessage('assistant', reply, true, null, reasoning);
        } catch (err) {
            removeTypingIndicator();
            addMessage('assistant', `⚠️ 失败：${err.message}`, false);
            conversationHistory.pop(); saveHistory();
            const userMsgs = document.querySelectorAll('.user-message');
            if (userMsgs.length) userMsgs[userMsgs.length-1].remove();
        } finally { disableButtons(false); userInput.focus(); }
    }

    async function regenerateLastReply() {
        if (!currentApiKey) { addMessage('assistant', '请先保存 API Key', false); return; }
        if (conversationHistory.length < 2) { addMessage('assistant', '没有可重生的消息', false); return; }
        if (conversationHistory[conversationHistory.length-1].role !== 'assistant') { addMessage('assistant', '最后一条不是AI回复', false); return; }
        conversationHistory.pop(); saveHistory();
        const lastAssistant = document.querySelectorAll('.assistant-message');
        if (lastAssistant.length) lastAssistant[lastAssistant.length-1].remove();
        const messagesForAPI = [{ role: 'system', content: '你是专业角色扮演AI。' }];
        for (const m of conversationHistory) messagesForAPI.push({ role: m.role, content: m.content });
        showTypingIndicator(); disableButtons(true);
        try {
            const resp = await fetch('https://api.deepseek.com/chat/completions', {
                method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${currentApiKey}` },
                body: JSON.stringify({ model: currentModel, messages: messagesForAPI, temperature: currentTemperature, stream: false })
            });
            removeTypingIndicator();
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            const data = await resp.json();
            addMessage('assistant', data.choices[0].message.content, true, null, data.choices[0].message.reasoning_content || null);
        } catch (err) { removeTypingIndicator(); addMessage('assistant', `重答失败: ${err.message}`, false); }
        finally { disableButtons(false); userInput.focus(); }
    }

    function undoLastUser() {
        let lastUserIdx = -1;
        for (let i=conversationHistory.length-1; i>=0; i--) if (conversationHistory[i].role === 'user') { lastUserIdx=i; break; }
        if (lastUserIdx === -1) { addMessage('assistant', '无撤回消息', false); return; }
        conversationHistory = conversationHistory.slice(0, lastUserIdx);
        saveHistory(); renderAllMessages();
        addMessage('assistant', '✅ 已撤回', false);
    }

    function saveApiKey() {
        const key = apiKeyInput.value.trim();
        if (key && key.startsWith('sk-')) {
            currentApiKey = key;
            localStorage.setItem(STORAGE_KEY_API, key);
            addMessage('assistant', '✅ Key 已保存', false);
            apiKeyInput.value = '';
        } else alert('请输入有效 API Key');
    }

    function newConversation() { conversationHistory = []; saveHistory(); messagesArea.innerHTML = ''; addMessage('assistant', '✨ 新对话已开始', false); }
    function loadInitialData() {
        const savedKey = localStorage.getItem(STORAGE_KEY_API);
        if (savedKey && savedKey.startsWith('sk-')) currentApiKey = savedKey;
        loadHistory(); loadModelPref(); loadTempPref(); loadExpertPref();
        if (conversationHistory.length === 0) addMessage('assistant', '🎭 角色扮演手机版\n点击⚙️可设置API Key和专家模式', false);
        else renderAllMessages();
        if (!currentApiKey) addMessage('assistant', '🔐 请点击⚙️，粘贴API Key', false);
    }

    menuToggle.addEventListener('click', () => settingsPanel.classList.toggle('open'));
    saveKeyBtn.addEventListener('click', saveApiKey);
    sendBtn.addEventListener('click', () => { const q = userInput.value.trim(); if (q) callDeepSeekV4(q); });
    userInput.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); const q = userInput.value.trim(); if (q) callDeepSeekV4(q); } });
    regenerateBtn.addEventListener('click', regenerateLastReply);
    undoBtn.addEventListener('click', undoLastUser);
    modelSelect.addEventListener('change', (e) => { currentModel = e.target.value; saveModelPref(); addMessage('assistant', `模型已切换`, false); });
    tempSlider.addEventListener('input', (e) => { currentTemperature = parseFloat(e.target.value); tempValue.innerText = currentTemperature.toFixed(2); saveTempPref(); });
    roleplayBtn.addEventListener('click', () => setExpertModeUI('roleplay'));
    analysisBtn.addEventListener('click', () => setExpertModeUI('analysis'));
    normalBtn.addEventListener('click', () => setExpertModeUI(null));

    loadInitialData();
    userInput.focus();
</script>
</body>
</html>
